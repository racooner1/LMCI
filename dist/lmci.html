<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LMCI</title>
<meta name="description" content="LMCI – deine eigene, abofreie Trainings-App. Alles bleibt auf deinem Gerät.">
<meta name="theme-color" content="#1E56C8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap">
<style>
/* LMCI – Design-System v2: kräftig, freundlich, motivierend. Tokens für hell und dunkel. */
:root {
  --bg: #f2f5fb;
  --surface: #ffffff;
  --surface-2: #eef2f9;
  --surface-3: #e3e9f4;
  --ink: #111a2e;
  --muted: #64708a;
  --line: #e1e7f0;
  --accent: #2f6bff;
  --accent-deep: #1f4fd6;
  --accent-ink: #ffffff;
  --accent-soft: #e6eeff;
  --accent-glow: rgba(47, 107, 255, 0.28);
  --xp: #f5a623;
  --xp-deep: #d98b0c;
  --xp-soft: #fff3d9;
  --flame: #ff6a3d;
  --flame-soft: #ffe9e0;
  --ok: #16a34a;
  --ok-deep: #12843c;
  --ok-soft: #dcfce7;
  --warn: #d97706;
  --warn-soft: #fef3c7;
  --danger: #dc2626;
  --danger-soft: #fee2e2;
  --deload: #7c3aed;
  --deload-soft: #ede9fe;
  --shadow-card: 0 1px 2px rgba(17, 26, 46, 0.04), 0 10px 30px -14px rgba(17, 26, 46, 0.16);
  --shadow-pop: 0 20px 50px -12px rgba(17, 26, 46, 0.35);
  --radius: 20px;
  --radius-s: 14px;
  --radius-xs: 10px;
  --font: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --nav-h: 66px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0d1220;
    --surface: #161d2e;
    --surface-2: #1d2639;
    --surface-3: #263149;
    --ink: #edf1f9;
    --muted: #97a3ba;
    --line: #273248;
    --accent: #5b8dff;
    --accent-deep: #3a6ae6;
    --accent-ink: #0a1430;
    --accent-soft: #1b2a4f;
    --accent-glow: rgba(91, 141, 255, 0.35);
    --xp: #ffb833;
    --xp-deep: #d9930f;
    --xp-soft: #3a2c0d;
    --flame: #ff7a4f;
    --flame-soft: #3d1e14;
    --ok: #34d068;
    --ok-deep: #1f9d4c;
    --ok-soft: #123522;
    --warn: #f0a530;
    --warn-soft: #3a2a0f;
    --danger: #f36b6b;
    --danger-soft: #3e1a1a;
    --deload: #a78bfa;
    --deload-soft: #2a2146;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -14px rgba(0, 0, 0, 0.6);
    --shadow-pop: 0 20px 50px -12px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0d1220;
  --surface: #161d2e;
  --surface-2: #1d2639;
  --surface-3: #263149;
  --ink: #edf1f9;
  --muted: #97a3ba;
  --line: #273248;
  --accent: #5b8dff;
  --accent-deep: #3a6ae6;
  --accent-ink: #0a1430;
  --accent-soft: #1b2a4f;
  --accent-glow: rgba(91, 141, 255, 0.35);
  --xp: #ffb833;
  --xp-deep: #d9930f;
  --xp-soft: #3a2c0d;
  --flame: #ff7a4f;
  --flame-soft: #3d1e14;
  --ok: #34d068;
  --ok-deep: #1f9d4c;
  --ok-soft: #123522;
  --warn: #f0a530;
  --warn-soft: #3a2a0f;
  --danger: #f36b6b;
  --danger-soft: #3e1a1a;
  --deload: #a78bfa;
  --deload-soft: #2a2146;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -14px rgba(0, 0, 0, 0.6);
  --shadow-pop: 0 20px 50px -12px rgba(0, 0, 0, 0.7);
  color-scheme: dark;
}

/* ---------- Basis ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
body.modal-open { overflow: hidden; }
a { color: var(--accent); }
h1, h2, h3 { font-weight: 800; line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
h1 { font-size: 1.85rem; }
h2 { font-size: 1.4rem; }
h3 { font-size: 1.05rem; font-weight: 700; margin-top: 1.1rem; margin-bottom: 0.4rem; }
p { margin: 0.3rem 0; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.hint { color: var(--muted); font-size: 0.875rem; margin-top: 0.75rem; }
code { font-family: ui-monospace, Menlo, monospace; font-size: 0.9em; }
:focus-visible { outline: 3px solid var(--accent-glow); outline-offset: 2px; border-radius: 6px; }
.ico { vertical-align: -0.2em; flex: none; }
.danger-text { color: var(--danger); }
.warn-text { color: var(--warn); }

.app { max-width: 720px; margin: 0 auto; padding-block: 12px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); padding-inline: 16px; }
.page { display: flex; flex-direction: column; gap: 14px; }
.page > * { animation: rise 0.35s ease both; }
.page > *:nth-child(2) { animation-delay: 0.04s; }
.page > *:nth-child(3) { animation-delay: 0.08s; }
.page > *:nth-child(4) { animation-delay: 0.12s; }
.page > *:nth-child(5) { animation-delay: 0.16s; }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes popin { 0% { transform: scale(0.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes flame { 0%, 100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.12) rotate(3deg); } }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.pop { animation: popin 0.35s cubic-bezier(0.2, 1.4, 0.4, 1) both; }

/* ---------- Karten ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-card); }
.card-accent { background: linear-gradient(135deg, var(--accent-soft), var(--surface) 70%); border-color: transparent; }
.card-hero { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%); color: #fff; border: 0; box-shadow: 0 18px 40px -18px var(--accent-glow); }
.card-hero .muted, .card-hero .small { color: rgba(255, 255, 255, 0.8); }
.card-hero .btn { border-bottom-color: rgba(0, 0, 0, 0.25); }
.card-hero .btn-primary { background: #fff; color: var(--accent-deep); border-bottom-color: rgba(0, 0, 0, 0.2); }
.card-hero .btn-ghost { background: rgba(255, 255, 255, 0.14); color: #fff; border-color: transparent; border-bottom-color: rgba(0, 0, 0, 0.2); }
.card-title { font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.74rem; color: var(--muted); }
.card-hero .card-title { color: rgba(255, 255, 255, 0.75); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.row { display: flex; align-items: center; flex-wrap: wrap; }
.row.top { align-items: flex-start; }
.gap { gap: 10px; }
.gap-s { gap: 6px; }
.between { justify-content: space-between; }
.end { justify-content: flex-end; }
.center { justify-content: center; }
.wrap { flex-wrap: wrap; }
.banner { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: var(--radius-s); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.note { background: var(--surface-2); border-left: 4px solid var(--accent); padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; }
.note.small { font-size: 0.85rem; }
.advice { padding: 10px 12px; border-radius: var(--radius-xs); font-size: 0.95rem; background: var(--surface-2); }
.advice.ok { background: var(--ok-soft); }
.advice.warn { background: var(--warn-soft); }

/* ---------- Buttons (drückbar) ---------- */
.btn { appearance: none; border: 1px solid var(--line); border-bottom-width: 4px; background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; padding: 10px 16px; border-radius: var(--radius-s); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; transition: transform 0.08s ease, border-bottom-width 0.08s ease, background 0.15s; letter-spacing: 0.01em; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(3px); border-bottom-width: 1px; }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); border-bottom-color: var(--accent-deep); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.06); }
.btn-ok { background: var(--ok); color: #fff; border-color: var(--ok); border-bottom-color: var(--ok-deep); }
.btn-ghost { background: transparent; border-color: var(--line); }
.btn-danger { color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); border-bottom-color: var(--danger); }
.btn-small { padding: 6px 12px; min-height: 36px; font-size: 0.88rem; border-bottom-width: 3px; }
.btn-big { padding: 14px 22px; font-size: 1.08rem; flex: 1; min-height: 56px; }
.btn-icon { appearance: none; border: 1px solid var(--line); border-bottom-width: 3px; background: var(--surface); color: var(--muted); width: 38px; height: 38px; border-radius: 12px; cursor: pointer; font: inherit; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; transition: transform 0.08s; }
.btn-icon:hover { color: var(--ink); }
.btn-icon:active { transform: translateY(2px); border-bottom-width: 1px; }
.btn-icon:disabled { opacity: 0.35; cursor: default; transform: none; }
.link { appearance: none; background: none; border: 0; color: inherit; font: inherit; text-align: left; padding: 0; cursor: pointer; width: 100%; }
.link.small { font-size: 0.85rem; width: auto; text-decoration: underline; }

/* ---------- Formulare ---------- */
.field { display: flex; flex-direction: column; gap: 5px; font-size: 0.9rem; color: var(--muted); }
.field > span, .field legend { font-weight: 600; }
.row > input { flex: 1; min-width: 120px; }
.field input, .field select, .select, .search, .textarea, .row > input { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius-xs); padding: 11px 14px; min-height: 46px; width: 100%; transition: border-color 0.15s, box-shadow 0.15s; }
.field input:focus, .field select:focus, .select:focus, .search:focus, .textarea:focus, .row > input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); outline: none; }
.textarea { min-height: 80px; resize: vertical; }
fieldset.field { border: 0; padding: 0; margin: 0; }
input[type='range'] { accent-color: var(--accent); padding: 0; min-height: 30px; }
.form { display: flex; flex-direction: column; gap: 12px; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.choice { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border: 2px solid var(--line); border-radius: var(--radius-s); cursor: pointer; background: var(--surface); transition: border-color 0.15s, background 0.15s, transform 0.08s; }
.choice:active { transform: scale(0.99); }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice.selected { border-color: var(--accent); background: var(--accent-soft); }
.choice:focus-within { outline: 3px solid var(--accent-glow); outline-offset: 2px; }
.choice-title { font-weight: 700; }
.choice-desc { font-size: 0.85rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 2px solid var(--line); border-radius: 999px; cursor: pointer; font-size: 0.93rem; font-weight: 600; background: var(--surface); transition: border-color 0.15s, background 0.15s, transform 0.08s; font-family: inherit; color: var(--ink); }
.chip:active { transform: scale(0.97); }
.chip input { accent-color: var(--accent); margin: 0; width: 16px; height: 16px; }
.chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.chip:disabled, .chip[disabled] { opacity: 0.5; }

/* ---------- Onboarding ---------- */
.onb { display: flex; flex-direction: column; gap: 16px; }
.onb-head { display: flex; flex-direction: column; gap: 10px; }
.brand { font-weight: 900; font-size: 2.4rem; letter-spacing: -0.03em; color: var(--accent); line-height: 1; display: inline-flex; align-items: center; gap: 10px; }
.brand-mark { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px -10px var(--accent-glow); }
.lede { font-size: 1.05rem; max-width: 60ch; }
.steps { list-style: none; padding: 0; margin: 4px 0 0; display: flex; gap: 6px; }
.steps li { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-3); font-size: 0; overflow: hidden; position: relative; }
.steps li span { display: none; }
.steps li.done, .steps li.active { background: var(--accent); }
.steps li.active { background: linear-gradient(90deg, var(--accent), var(--accent-deep)); }
.onb-card { gap: 6px; }
.onb-card h2 { margin-bottom: 4px; }
.onb-nav { margin-top: 4px; }
details.group { border: 1.5px solid var(--line); border-radius: var(--radius-s); padding: 10px 14px; margin-bottom: 8px; background: var(--surface); }
details.group summary { cursor: pointer; font-weight: 600; }
details.group .chips { margin-top: 10px; }

/* ---------- Heute: Hero, Streak, Level ---------- */
.hero { display: flex; flex-direction: column; gap: 14px; padding: 20px; position: relative; overflow: hidden; }
.hero::after { content: ''; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); pointer-events: none; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: relative; }
.hero h1 { font-size: 1.7rem; }
.streak-pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.16); border-radius: 999px; padding: 6px 12px 6px 8px; font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
.streak-pill .ico { color: #ffd166; animation: flame 1.6s ease-in-out infinite; }
.streak-pill.cold .ico { color: rgba(255, 255, 255, 0.6); animation: none; }
.level-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-weight: 600; font-size: 0.95rem; }
.xp-bar { height: 12px; border-radius: 6px; background: rgba(255, 255, 255, 0.22); overflow: hidden; }
.xp-bar > div { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #ffd166, #ffb020); transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 0 12px rgba(255, 209, 102, 0.6); }
.card .xp-bar { background: var(--surface-3); }
.xp-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--xp-soft); color: var(--xp-deep); font-weight: 800; font-size: 0.8rem; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.card-hero .xp-chip { background: rgba(255, 255, 255, 0.18); color: #ffd166; }
.hero-stats { display: flex; gap: 14px; flex-wrap: wrap; }
.hero-stat { display: flex; flex-direction: column; line-height: 1.1; }
.hero-stat strong { font-size: 1.5rem; font-weight: 800; }
.hero-stat span { font-size: 0.78rem; opacity: 0.85; }

/* Tagesziele-Checkliste */
.goals { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.goal { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--radius-s); background: var(--surface-2); text-decoration: none; color: inherit; transition: background 0.15s, transform 0.08s; cursor: pointer; border: 0; font: inherit; text-align: left; width: 100%; }
.goal:active { transform: scale(0.99); }
.goal.done { background: var(--ok-soft); }
.goal.optional { opacity: 0.85; }
.goal-check { width: 36px; height: 36px; border-radius: 50%; border: 2.5px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; color: transparent; transition: background 0.2s, border-color 0.2s; }
.goal.done .goal-check { background: var(--ok); border-color: var(--ok); color: #fff; }
.goal-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.goal-text strong { font-weight: 700; }
.goal-text span { font-size: 0.8rem; color: var(--muted); }
.goal.done .goal-text strong { text-decoration: line-through; color: var(--muted); }
.goals-progress { display: flex; align-items: center; gap: 10px; }
.goals-progress .xp-bar { flex: 1; height: 10px; background: var(--surface-3); }
.goals-progress .xp-bar > div { background: linear-gradient(90deg, var(--ok), #4ade80); box-shadow: none; }

/* Ringe */
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
.ring .track { stroke: var(--surface-3); }
.ring .fill { stroke: var(--accent); transition: stroke-dashoffset 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
.ring.ok .fill { stroke: var(--ok); }
.ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.ring-label strong { font-size: 1.25rem; font-weight: 800; }
.ring-label span { font-size: 0.66rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.week-row { display: flex; align-items: center; gap: 16px; }
.week-dots { display: flex; gap: 6px; align-items: flex-end; flex: 1; }
.dot-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--muted); font-weight: 600; }
.dot-day i { width: 100%; height: 10px; border-radius: 5px; background: var(--surface-3); }
.dot-day.planned i { background: var(--accent-soft); border: 1.5px solid var(--accent); }
.dot-day.done i { background: var(--ok); border-color: var(--ok); }
.dot-day.today span { color: var(--accent); }
.dot-sum { font-weight: 800; font-size: 1.15rem; padding-left: 6px; }

/* Schnellaktionen */
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.action { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: var(--radius-s); background: var(--surface); border: 1px solid var(--line); border-bottom-width: 4px; text-decoration: none; color: var(--ink); font-size: 0.78rem; font-weight: 700; text-align: center; transition: transform 0.08s; box-shadow: var(--shadow-card); }
.action:active { transform: translateY(3px); border-bottom-width: 1px; }
.action .ico { width: 26px; height: 26px; color: var(--accent); }
.action.flame .ico { color: var(--flame); }
.action.ok .ico { color: var(--ok); }
.action.xp .ico { color: var(--xp); }
@media (max-width: 380px) { .actions { grid-template-columns: repeat(2, 1fr); } }

.week-chip { display: flex; flex-direction: column; align-items: flex-end; background: var(--accent-soft); border-radius: 12px; padding: 6px 12px; line-height: 1.15; }
.week-chip.deload { background: var(--deload-soft); }
.week-chip-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.week-chip-week { font-weight: 800; font-size: 1.2rem; }
.week-chip.deload .week-chip-week { color: var(--deload); }
.session-name { font-size: 1.7rem; }
.ex-preview { list-style: none; padding: 0; margin: 4px 0; display: flex; flex-direction: column; gap: 2px; font-size: 0.95rem; }
.ex-preview li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding: 4px 0; }
.ex-preview li:last-child { border-bottom: 0; }
.card-hero .ex-preview li { border-bottom-color: rgba(255, 255, 255, 0.2); }

.stat { display: flex; align-items: baseline; gap: 6px; }
.stat-num { font-weight: 800; font-size: 2.1rem; line-height: 1; letter-spacing: -0.02em; }
.stat.big .stat-num { font-size: 3.2rem; }
.stat-unit { color: var(--muted); font-size: 0.9rem; }
.summary { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 8px; }
.summary.center { justify-content: center; }

.list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.list li.done { color: var(--muted); }
.list li .check { color: var(--ok); font-weight: 800; }
.list.tappable li { padding: 0; }
.list.tappable li > a, .list.tappable li > button { display: block; width: 100%; padding: 11px 8px; text-decoration: none; color: inherit; border-radius: var(--radius-xs); }
.list.tappable li > a:hover, .list.tappable li > button:hover { background: var(--surface-2); }
.bullets { padding-left: 1.2rem; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.mob-list { padding-left: 1.4rem; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.mob-list li { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.pill { white-space: nowrap; font-size: 0.8rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-weight: 600; }
.cue { background: var(--surface-2); border-radius: var(--radius-xs); padding: 10px 12px; }
.modal-text { font-size: 1rem; margin-bottom: 14px; }
.readiness { font-weight: 800; font-size: 0.95rem; padding: 3px 12px; border-radius: 999px; background: var(--surface-2); }
.readiness.gut { color: var(--ok); background: var(--ok-soft); }
.readiness.mittel { color: var(--warn); background: var(--warn-soft); }
.readiness.niedrig { color: var(--danger); background: var(--danger-soft); }
.field.slider input { width: 100%; }

/* ---------- Tabs & Tabellen ---------- */
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; overflow-x: auto; }
.tab { appearance: none; background: none; border: 0; padding: 8px 14px; font: inherit; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; border-radius: 999px; flex: 1; transition: background 0.15s, color 0.15s; }
.tab.active { color: var(--accent-ink); background: var(--accent); }
.tab-panel { display: flex; flex-direction: column; gap: 14px; }
.picker-tabs { display: flex; gap: 4px; overflow-x: auto; background: var(--surface-2); padding: 4px; border-radius: 999px; }
.picker-tabs .tab { padding: 7px 10px; font-size: 0.85rem; }
.ex-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
.ex-table th { text-align: left; font-weight: 700; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.ex-table td { padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ex-table tr:last-child td { border-bottom: 0; }
.ex-table .num, .ex-table th.num { text-align: right; white-space: nowrap; }
.ex-table .now { color: var(--accent); font-weight: 700; }
.ex-table tr.tappable { cursor: pointer; }
.ex-table tr.tappable:hover td { background: var(--surface-2); }
.ex-name { font-weight: 600; }
.day-card { gap: 8px; }
.filters { gap: 10px; }
.select.auto { width: auto; flex: 1; min-width: 140px; }

/* ---------- Volumen & Diagramme ---------- */
.vol-list { display: flex; flex-direction: column; gap: 7px; }
.vol-row { display: grid; grid-template-columns: 76px 1fr 56px; gap: 8px; align-items: center; font-size: 0.9rem; }
.vol-track { position: relative; height: 14px; background: var(--surface-2); border-radius: 7px; overflow: hidden; }
.vol-range { position: absolute; top: 0; bottom: 0; background: var(--accent-soft); border-left: 1px solid var(--accent); border-right: 1px solid var(--accent); }
.vol-fill { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 4px; background: var(--accent); }
.vol-fill.low { background: var(--warn); }
.vol-fill.high { background: var(--danger); }
.vol-num { text-align: right; font-weight: 700; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 12px; font-family: var(--font); }
.chart .tick.strong { fill: var(--ink); font-weight: 700; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.chart .line-secondary { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart .area { fill: var(--accent); opacity: 0.12; }
.chart .dot { fill: var(--accent); }
.chart .bar { fill: var(--accent); }
.chart .bar.secondary { fill: var(--ok); }
.chart .target { stroke: var(--warn); stroke-dasharray: 5 4; }
.chart-empty { color: var(--muted); padding: 24px; text-align: center; background: var(--surface-2); border-radius: var(--radius-xs); }

/* ---------- Training ---------- */
.workout-progress { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 6px 0 8px; margin: -6px 0 0; }
.workout-progress .bar { height: 10px; border-radius: 5px; background: var(--surface-3); overflow: hidden; }
.workout-progress .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--ok)); border-radius: 5px; transition: width 0.4s; }
.workout-progress .meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-weight: 600; margin-top: 4px; }
.ex-card { gap: 10px; }
.ex-card.complete { border-color: var(--ok); }
.ex-title { font-weight: 800; font-size: 1.25rem; line-height: 1.15; letter-spacing: -0.01em; }
.ex-tools { display: flex; gap: 6px; flex-wrap: wrap; }
.suggestion { display: flex; flex-direction: column; gap: 3px; font-size: 0.9rem; padding: 10px 12px; border-radius: var(--radius-xs); background: var(--surface-2); border-left: 4px solid var(--muted); }
.suggestion.up { border-left-color: var(--ok); background: var(--ok-soft); }
.suggestion.down, .suggestion.hold { border-left-color: var(--warn); background: var(--warn-soft); }
.suggestion.deload { border-left-color: var(--deload); background: var(--deload-soft); }
.suggestion.reps, .suggestion.start { border-left-color: var(--accent); }
.badge { display: inline-block; align-self: flex-start; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); margin-right: 6px; font-weight: 800; }
.warmup-list { display: flex; flex-direction: column; gap: 4px; background: var(--surface-2); border-radius: var(--radius-xs); padding: 8px 12px; font-size: 0.9rem; }
.warmup-row { display: flex; gap: 12px; justify-content: space-between; }
.options .btn.active { border-color: var(--accent); background: var(--accent-soft); }
.set-table { display: flex; flex-direction: column; gap: 8px; }
.set-head, .set-row { display: grid; grid-template-columns: 34px 1fr 1fr 76px 52px; gap: 8px; align-items: center; }
.set-head { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0 4px; font-weight: 700; }
.set-idx { text-align: center; color: var(--muted); font-weight: 800; }
.set-row input, .set-row select { font: inherit; font-size: 1.1rem; font-weight: 600; color: var(--ink); background: var(--surface-2); border: 1.5px solid transparent; border-radius: var(--radius-xs); padding: 8px 6px; min-height: 50px; width: 100%; text-align: center; transition: border-color 0.15s, background 0.2s; }
.set-row input:focus, .set-row select:focus { border-color: var(--accent); background: var(--surface); outline: none; }
.set-row.done input, .set-row.done select { background: var(--ok-soft); color: var(--ok-deep); }
.set-done { appearance: none; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--surface); border-radius: 12px; min-height: 50px; font-size: 1.2rem; cursor: pointer; color: var(--muted); transition: transform 0.08s, background 0.2s; display: inline-flex; align-items: center; justify-content: center; }
.set-done:active { transform: translateY(2px); border-bottom-width: 2px; }
.set-row.done .set-done { background: var(--ok); color: #fff; border-color: var(--ok); border-bottom-color: var(--ok-deep); }
.rest-bar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); z-index: 20; overflow: hidden; border-radius: 16px 16px 0 0; }
.rest-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); opacity: 0.45; width: 0; transition: width 0.25s linear; }
.rest-content { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 16px; max-width: 720px; margin: 0 auto; }
.rest-label { text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.72rem; opacity: 0.8; font-weight: 700; }
.rest-time { font-weight: 800; font-size: 1.7rem; flex: 1; }
.rest-bar .btn { background: rgba(255, 255, 255, 0.1); color: inherit; border-color: rgba(255, 255, 255, 0.2); border-bottom-color: rgba(0, 0, 0, 0.4); }
.plates { min-height: 40px; }
.plate-row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.plate { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; border-radius: 6px; font-weight: 800; color: #fff; background: #444; padding: 0 6px; }
.plate.p25 { background: #c62828; height: 56px; }
.plate.p20 { background: #1e56c8; height: 52px; }
.plate.p15 { background: #e0b300; color: #222; height: 48px; }
.plate.p10 { background: #2e8b57; }
.plate.p5 { background: #f2f2f2; color: #222; border: 1px solid #999; height: 36px; }
.plate.p2_5 { background: #222; height: 32px; min-width: 36px; }
.plate.p1_25 { background: #888; height: 28px; min-width: 32px; }
.detail-ex { padding: 6px 0; border-bottom: 1px solid var(--line); }
.detail-ex:last-of-type { border-bottom: 0; }

/* ---------- Feier ---------- */
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
.celebrate { display: flex; flex-direction: column; gap: 14px; text-align: center; }
.celebrate-hero { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px; border-radius: var(--radius); background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #fff; }
.celebrate-hero.levelup { background: linear-gradient(135deg, var(--xp), #ff7a1a); }
.celebrate-icon { width: 72px; height: 72px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); display: inline-flex; align-items: center; justify-content: center; animation: popin 0.6s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
.celebrate-xp { font-weight: 900; font-size: 2.6rem; line-height: 1; letter-spacing: -0.02em; }
.celebrate-sub { opacity: 0.9; }
.levelup-banner { background: var(--xp-soft); color: var(--xp-deep); font-weight: 800; padding: 10px 14px; border-radius: var(--radius-xs); display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.reward-list { display: flex; flex-direction: column; gap: 6px; text-align: left; }
.reward { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: var(--radius-xs); padding: 8px 12px; }
.reward .ico { color: var(--xp); }

/* ---------- Ernährung ---------- */
.mini-bar { height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
.mini-bar > div { height: 100%; background: var(--accent); border-radius: 4px; }
.date-nav { display: flex; align-items: center; gap: 8px; }
.date-nav .btn { min-height: 40px; padding: 6px 12px; }
.date-nav strong { flex: 1; text-align: center; font-size: 1.15rem; font-weight: 800; }
.kcal-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kcal-head .stat-num { font-size: 3rem; }
.kcal-bar { height: 14px; background: var(--surface-3); border-radius: 7px; overflow: hidden; }
.kcal-bar > div { height: 100%; background: var(--accent); transition: width 0.5s; border-radius: 7px; }
.kcal-bar > div.over { background: var(--danger); }
.macro-bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mbar { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; }
.mbar-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.mbar-num { font-weight: 800; }
.mbar-track { height: 9px; background: var(--surface-3); border-radius: 5px; overflow: hidden; }
.mbar-track > div { height: 100%; border-radius: 5px; transition: width 0.5s; }
.mbar.protein .mbar-track > div { background: var(--ok); }
.mbar.carbs .mbar-track > div { background: var(--accent); }
.mbar.fat .mbar-track > div { background: var(--xp); }
.meal-card { gap: 6px; }
.meal-head { display: flex; justify-content: space-between; align-items: center; }
.entry-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
.entry-row:last-of-type { border-bottom: 0; }
.entry-row .muted { font-size: 0.8rem; }
.entry-kcal { font-weight: 800; white-space: nowrap; }
.water-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.glasses { display: flex; gap: 4px; flex-wrap: wrap; }
.glass { width: 18px; height: 24px; border: 2px solid var(--accent); border-radius: 3px 3px 6px 6px; background: transparent; transition: background 0.2s; }
.glass.full { background: var(--accent); }
.food-list { list-style: none; padding: 0; margin: 0; max-height: 50vh; overflow: auto; }
.food-list li button { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 9px 8px; border-radius: var(--radius-xs); }
.food-list li button:hover { background: var(--surface-2); }
.food-kcal { text-align: right; font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.food-kcal strong { color: var(--ink); display: block; }
.portion-preview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; background: var(--surface-2); border-radius: var(--radius-xs); padding: 10px; }
.portion-preview span { display: block; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.portion-preview strong { font-size: 1.25rem; font-weight: 800; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.bc-video { width: 100%; max-height: 40vh; background: #000; border-radius: var(--radius-xs); }
.star { appearance: none; border: 0; background: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); }
.star.on { color: var(--xp); }
.ingredient-row { display: grid; grid-template-columns: 1fr 80px 38px; gap: 6px; align-items: center; }
.review-days { display: flex; gap: 4px; align-items: flex-end; height: 72px; }
.review-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem; color: var(--muted); height: 100%; justify-content: flex-end; }
.review-day i { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.review-day.over i { background: var(--danger); }
.review-day.none i { background: var(--surface-3); }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.macro { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--radius-xs); padding: 10px; }
.macro-num { font-weight: 800; font-size: 1.4rem; }
.macro-label { font-size: 0.85rem; font-weight: 600; }

/* ---------- Kalender, Abzeichen, Chat, Timer, Bibliothek ---------- */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-head { text-align: center; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 4px 0; font-weight: 700; }
.cal-cell { appearance: none; border: 1.5px solid transparent; background: var(--surface-2); border-radius: 12px; min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5px 2px; font: inherit; color: var(--ink); cursor: pointer; }
.cal-cell.empty { background: transparent; cursor: default; }
.cal-cell.today { border-color: var(--accent); }
.cal-cell.future { opacity: 0.5; }
.cal-cell.missed { border-color: var(--warn); border-style: dashed; }
.cal-cell[data-empty] { color: var(--muted); }
.cal-num { font-size: 0.9rem; font-weight: 700; }
.cal-dots { display: flex; gap: 2px; min-height: 8px; }
.cal-dots i, .cal-legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.d-strength { background: var(--accent); }
.d-cardio { background: var(--ok); }
.d-food { background: var(--xp); }
.d-checkin { background: var(--deload); }
.cal-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.75rem; color: var(--muted); margin-top: 8px; align-items: center; }
.cal-legend span { display: inline-flex; align-items: center; gap: 4px; }
.missed-legend::before { content: ''; width: 12px; height: 12px; border: 1.5px dashed var(--warn); border-radius: 3px; display: inline-block; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.badge-tile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 12px 6px; border-radius: var(--radius-s); background: var(--surface-2); opacity: 0.5; filter: grayscale(1); transition: transform 0.15s; }
.badge-tile.earned { opacity: 1; filter: none; background: var(--xp-soft); }
.badge-tile.earned:hover { transform: translateY(-2px); }
.badge-icon { font-size: 1.7rem; }
.badge-name { font-weight: 700; font-size: 0.85rem; }
.level-card { display: flex; align-items: center; gap: 16px; }
.level-num { width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, var(--xp), #ff7a1a); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.6rem; flex: none; box-shadow: 0 12px 24px -12px rgba(245, 166, 35, 0.7); }
.chat { display: flex; flex-direction: column; gap: 10px; min-height: 120px; max-height: 55vh; overflow: auto; padding: 4px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; font-size: 0.95rem; line-height: 1.45; }
.msg p { margin: 0 0 6px; }
.msg p:last-child { margin: 0; }
.msg ul { margin: 4px 0; padding-left: 18px; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.streaming { opacity: 0.85; }
.itimer { display: flex; flex-direction: column; gap: 12px; align-items: stretch; text-align: center; }
.itimer-phase { font-weight: 800; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.itimer-time { font-weight: 900; font-size: 4.5rem; line-height: 1; letter-spacing: -0.03em; }
.itimer[data-kind='hard'] .itimer-time { color: var(--danger); }
.itimer[data-kind='easy'] .itimer-time { color: var(--ok); }
.itimer-bar { height: 12px; background: var(--surface-3); border-radius: 6px; overflow: hidden; }
.itimer-fill { height: 100%; width: 0; background: var(--accent); transition: width 0.5s linear; }
.itimer-list { list-style: none; padding: 0; margin: 0; max-height: 200px; overflow: auto; text-align: left; font-size: 0.9rem; }
.itimer-list li { display: flex; justify-content: space-between; padding: 5px 8px; border-radius: 8px; }
.itimer-list li.now { background: var(--accent-soft); font-weight: 700; }
.itimer-list li.hard span:first-child { color: var(--danger); }
.bodymap-wrap { display: flex; gap: 8px; justify-content: center; }
.bodymap { width: 120px; max-width: 45%; height: auto; }
.bodymap .silhouette { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; }
.bodymap .m-none { fill: var(--line); opacity: 0.6; }
.bodymap .m-primary { fill: var(--accent); }
.bodymap .m-secondary { fill: var(--accent); opacity: 0.4; }
.bodymap-label { fill: var(--muted); font-size: 12px; font-family: var(--font); }
.task-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.task { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 12px; }
.task-num { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; }
.quick-card { border-style: dashed; }

/* ---------- Navigation ---------- */
.nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 24px); max-width: 560px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; display: flex; justify-content: space-around; padding: 6px; z-index: 10; box-shadow: var(--shadow-pop); }
.nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px; text-decoration: none; color: var(--muted); font-size: 0.68rem; font-weight: 700; border-radius: 16px; transition: background 0.15s, color 0.15s; }
.nav a .ico { width: 24px; height: 24px; }
.nav a.active { color: var(--accent); background: var(--accent-soft); }

/* ---------- Toast & Modal ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 26px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 14px; font-size: 0.95rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 40; max-width: calc(100% - 32px); box-shadow: var(--shadow-pop); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast-ok { background: var(--ok); color: #fff; }
.toast-warn { background: var(--warn); color: #fff; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(8, 12, 24, 0.55); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; z-index: 30; padding: 0; animation: fade 0.2s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheet { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

  function muscleDeltasFromFeedback(fb, trained) {
    const out = {};
    if (!fb) return out;
    const sore = new Set(fb.sore || []);
    const more = new Set(fb.more || []);
    const globalDown = (fb.rpe ?? 8) >= 9.5 && fb.performance === "schlechter";
    const globalUp = (fb.rpe ?? 8) <= 7 && fb.performance === "besser";
    for (const m of trained) {
      if (sore.has(m) || globalDown) out[m] = -1;
      else if (more.has(m) || globalUp) out[m] = 1;

  function bestE1RM(entry) {
    let best = 0;

    return Math.round(best * 10) / 10;

  function plates(targetWeight, barWeight = 20, available = [25, 20, 15, 10, 5, 2.5, 1.25]) {
    let perSide = (targetWeight - barWeight) / 2;

    const out = [];
    for (const p2 of [...available].sort((a2, b2) => b2 - a2)) {
      while (perSide >= p2 - 1e-9) {
        out.push(p2);
        perSide -= p2;

  }

  // src/engine/analytics.js
  function workoutsInWeek(workouts, weekStart) {
    const end = addDays(weekStart, 7);
    return workouts.filter((w) => w.date >= weekStart && w.date < end);
  }
  function weeklyVolume(workouts, weekStart) {
    const vol = Object.fromEntries(MUSCLES.map((m) => [m.id, 0]));
    for (const w of workoutsInWeek(workouts, weekStart)) {
      for (const e of w.entries) {
        const ex2 = getExercise(e.exId);
        if (!ex2) continue;
        const n = e.sets.filter((s) => s.reps > 0).length;
        for (const m of ex2.primary) vol[m] += n;
        for (const m of ex2.secondary) vol[m] += n * 0.5;
      }
    }
    return vol;
  }
  function totalTonnage(workout) {
    let t2 = 0;
    for (const e of workout.entries) for (const s of e.sets) if (s.reps > 0) t2 += (s.weight || 0) * s.reps;
    return Math.round(t2);
  }
  function totalSets(workout) {
    return workout.entries.reduce((a2, e) => a2 + e.sets.filter((s) => s.reps > 0).length, 0);
  }
  function e1rmHistory(workouts, exId) {
    const out = [];
    for (const w of [...workouts].sort((a2, b2) => a2.date < b2.date ? -1 : 1)) {
      const e = w.entries.find((x) => x.exId === exId);
      if (!e) continue;
      const v = bestE1RM(e);
      if (v > 0) out.push({ date: w.date, e1rm: v });
    }
    return out;
  }
  function historyFor(workouts, exId, limit = 6) {
    const list = [];
    for (const w of [...workouts].sort((a2, b2) => a2.date < b2.date ? -1 : 1)) {
      const e = w.entries.find((x) => x.exId === exId && x.sets.some((s) => s.reps > 0));
      if (e) list.push({ date: w.date, sets: e.sets });
    }
    return list.slice(-limit);
  }
  function personalRecords(workouts) {
    const best = {};
    for (const w of workouts) {
      for (const e of w.entries) {
        const v = bestE1RM(e);
        const maxW = Math.max(0, ...e.sets.filter((s) => s.reps > 0).map((s) => s.weight || 0));
        const maxReps = Math.max(0, ...e.sets.map((s) => s.reps || 0));
        const cur = best[e.exId];
        if (!cur || v > cur.e1rm || v === cur.e1rm && maxW > cur.weight) {
          best[e.exId] = { exId: e.exId, e1rm: v, weight: maxW, reps: maxReps, date: w.date };
        }
      }
    }
    return Object.values(best).sort((a2, b2) => b2.e1rm - a2.e1rm);
  }
  function newRecords(workout, previousWorkouts) {
    const prev = Object.fromEntries(personalRecords(previousWorkouts).map((r) => [r.exId, r]));
    const out = [];
    for (const e of workout.entries) {
      const v = bestE1RM(e);
      const ex2 = getExercise(e.exId);
      if (!ex2) continue;
      if (v > 0 && (!prev[e.exId] || v > prev[e.exId].e1rm + 0.05)) out.push({ exId: e.exId, e1rm: v, name: ex2.name });
      else if (v === 0) {
        const reps = Math.max(0, ...e.sets.map((s) => s.reps || 0));
        if (reps > 0 && (!prev[e.exId] || reps > prev[e.exId].reps)) out.push({ exId: e.exId, reps, name: ex2.name });
      }
    }
    return out;
  }
  function adherence(plan, workouts, weekStart) {
    const done = workoutsInWeek(workouts, weekStart).filter((w) => w.planId === plan.id);
    return { done: done.length, planned: plan.days.length, dayIds: new Set(done.map((w) => w.dayId)) };
  }
  function streakWeeks(plan, workouts, today = toISODate()) {
    let streak = 0;
    let ws2 = startOfWeek(today);
    for (let i = 0; i < 52; i++) {
      const a2 = adherence(plan, workouts, ws2);
      if (a2.done >= Math.max(1, a2.planned - 1)) streak++;
      else if (i > 0) break;
      else if (a2.done === 0) break;
      ws2 = addDays(ws2, -7);
    }
    return streak;
  }
  function weeklySeries(workouts, cardioLogs, weeks = 8, today = toISODate()) {
    const out = [];
    let ws2 = addDays(startOfWeek(today), -7 * (weeks - 1));
    for (let i = 0; i < weeks; i++) {
      const end = addDays(ws2, 7);
      const wk = workouts.filter((w) => w.date >= ws2 && w.date < end);
      const cl2 = cardioLogs.filter((c) => c.date >= ws2 && c.date < end);
      out.push({ weekStart: ws2, sessions: wk.length, sets: wk.reduce((a2, w) => a2 + totalSets(w), 0), tonnage: wk.reduce((a2, w) => a2 + totalTonnage(w), 0), cardioMin: cl2.reduce((a2, c) => a2 + (c.minutes || 0), 0) });
      ws2 = end;
    }
    return out;
  }

  // src/engine/recovery.js
  function readinessScore(c) {
    if (!c) return null;
    let s = 0;
    const sleepH = c.sleep ?? 7;
    s += sleepH >= 7.5 ? 3 : sleepH >= 6.5 ? 2 : sleepH >= 5.5 ? 1 : 0;
    s += ((c.sleepQuality ?? 3) - 1) * 0.75;
    s += (5 - (c.stress ?? 3)) * 0.75;
    s += ((c.energy ?? 3) - 1) * 0.75;
    const score = Math.round(s / 12 * 100);
    const level = score >= 65 ? "gut" : score >= 40 ? "mittel" : "niedrig";
    return { score, level };
  }
  function readinessAdvice(r, soreCount = 0) {
    if (!r) return { text: "Kurzer Check-in: Schlaf, Stress, Energie \u2013 dann passt LMCI die heutige Einheit an.", mode: "normal" };
    if (r.level === "gut" && soreCount === 0) return { text: "Gute Bereitschaft \u2013 heute darf es schwer werden. Wenn die Vorgaben leicht wirken: eine Wiederholung mehr.", mode: "normal" };
    if (r.level === "niedrig") return { text: "Niedrige Bereitschaft. Empfehlung: leichte Version (ein Satz weniger pro \xDCbung, eine Wiederholung mehr in Reserve) oder Ruhetag mit Mobilit\xE4t.", mode: "leicht" };
    if (soreCount >= 2) return { text: "Mehrere Muskeln noch nicht erholt. Trainiere normal, aber halte 1\u20132 Wiederholungen mehr in Reserve.", mode: "leicht" };
    return { text: "Mittlere Bereitschaft \u2013 normal trainieren, Technik vor Gewicht.", mode: "normal" };
  }

  // src/ui/timer.js
  var t = null;
  function beep(freq = 880, ms2 = 250) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g2 = ctx.createGain();
      o.connect(g2);
      g2.connect(ctx.destination);
      o.frequency.value = freq;
      g2.gain.value = 0.2;
      o.start();
      o.stop(ctx.currentTime + ms2 / 1e3);
      setTimeout(() => ctx.close?.(), ms2 + 200);
    } catch {
    }
    try {
      navigator.vibrate?.(150);
    } catch {
    }
  }
  function openIntervalTimer(session, week) {
    const w = Math.max(0, Math.min(4, week - 1));
    const phases = [];
    if (session.intervals) {
      const rounds = session.intervals.roundsByWeek[w];
      phases.push({ name: "Aufw\xE4rmen", sec: 300, kind: "easy" });
      for (let i = 1; i <= rounds; i++) {
        phases.push({ name: `Intervall ${i}/${rounds} \u2013 hart`, sec: session.intervals.work, kind: "hard" });
        if (i < rounds) phases.push({ name: `Locker`, sec: session.intervals.rest, kind: "easy" });
      }
      phases.push({ name: "Auslaufen", sec: 300, kind: "easy" });
    } else {
      const total = session.minutesByWeek[w] * 60;
      phases.push({ name: session.name, sec: total, kind: "steady" });
    }
    const totalSec = phases.reduce((a2, p2) => a2 + p2.sec, 0);
    stop();
    t = { phases, idx: 0, left: phases[0].sec, running: false, handle: null, elapsed: 0 };
    const m = openModal(
      `<div class="itimer">
      <div class="itimer-phase" id="it-phase">${phases[0].name}</div>
      <div class="itimer-time" id="it-time">${fmtMin(phases[0].sec)}</div>
      <div class="itimer-bar"><div class="itimer-fill" id="it-fill"></div></div>
      <div class="muted small" id="it-total">Gesamt ${fmtMin(totalSec)} \xB7 ${phases.length} Abschnitte</div>
      <div class="row gap center">
        <button class="btn btn-primary btn-big" id="it-start">Start</button>
        <button class="btn" id="it-skip">Abschnitt \xFCberspringen</button>
      </div>
      <ol class="itimer-list" id="it-list">${phases.map((p2, i) => `<li class="${i === 0 ? "now" : ""} ${p2.kind}"><span>${p2.name}</span><span>${fmtMin(p2.sec)}</span></li>`).join("")}</ol>
    </div>`,
      { title: session.name, onClose: stop }
    );
    const el2 = {
      phase: m.querySelector("#it-phase"),
      time: m.querySelector("#it-time"),
      fill: m.querySelector("#it-fill"),
      start: m.querySelector("#it-start"),
      list: m.querySelector("#it-list"),
      wrap: m.querySelector(".itimer")
    };
    const render = () => {
      const p2 = t.phases[t.idx];
      el2.phase.textContent = p2.name;
      el2.time.textContent = fmtMin(t.left);
      el2.fill.style.width = `${(1 - t.left / p2.sec) * 100}%`;
      el2.wrap.dataset.kind = p2.kind;
      el2.list.querySelectorAll("li").forEach((li2, i) => li2.classList.toggle("now", i === t.idx));
    };
    const tick = () => {
      t.left -= 1;
      if (t.left <= 0) {
        if (t.idx < t.phases.length - 1) {
          t.idx += 1;
          t.left = t.phases[t.idx].sec;
          beep(t.phases[t.idx].kind === "hard" ? 1100 : 660, 350);
        } else {
          stop();
          beep(880, 600);
          el2.phase.textContent = "Fertig \u2013 stark!";
          el2.time.textContent = "0:00";
          el2.start.textContent = "Nochmal";
          t.idx = 0;
          t.left = t.phases[0].sec;
          return;
        }
      } else if (t.left <= 3) beep(500, 120);
      render();
    };
    el2.start.addEventListener("click", () => {
      if (t.running) {
        clearInterval(t.handle);
        t.running = false;
        el2.start.textContent = "Weiter";
      } else {
        t.running = true;
        t.handle = setInterval(tick, 1e3);
        el2.start.textContent = "Pause";
        beep(660, 150);
      }
    });
    m.querySelector("#it-skip").addEventListener("click", () => {
      if (t.idx < t.phases.length - 1) {
        t.idx += 1;
        t.left = t.phases[t.idx].sec;
        render();
      }
    });
    render();
  }
  function stop() {

    if (t) t.running = false;
  }

  // src/ui/charts.js
  var W = 640;
  var H = 220;
  var PAD = { l: 44, r: 16, t: 16, b: 34 };
  function scale(domain, range) {
    const [d0, d1] = domain;
    const [r0, r12] = range;
    const span = d1 - d0 || 1;
    return (v) => r0 + (v - d0) / span * (r12 - r0);
  }
  function niceTicks(min, max, n = 4) {
    const span = max - min || 1;
    const raw2 = span / n;
    const mag = Math.pow(10, Math.floor(Math.log10(raw2)));
    const norm = raw2 / mag;
    const step2 = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    const start = Math.floor(min / step2) * step2;
    const ticks = [];
    for (let v = start; v <= max + step2 * 0.01; v += step2) ticks.push(Math.round(v * 1e3) / 1e3);
    return ticks;
  }
  function lineChart(points, { yLabel = "", secondary = null, unit = "", minZero = false } = {}) {
    if (!points.length) return `<div class="chart-empty">Noch keine Daten.</div>`;
    const ys2 = points.map((p2) => p2.y).concat(secondary ? secondary.map((p2) => p2.y) : []);
    let yMin = minZero ? 0 : Math.min(...ys2);
    let yMax = Math.max(...ys2);
    if (yMin === yMax) {
      yMin -= 1;
      yMax += 1;
    }
    const padY = (yMax - yMin) * 0.1;
    yMin = minZero ? 0 : yMin - padY;
    yMax += padY;
    const x = scale([0, Math.max(1, points.length - 1)], [PAD.l, W - PAD.r]);
    const y2 = scale([yMin, yMax], [H - PAD.b, PAD.t]);
    const ticks = niceTicks(yMin, yMax);
    const path = (pts) => pts.map((p2, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y2(p2.y).toFixed(1)}`).join(" ");
    const area = `${path(points)} L${x(points.length - 1).toFixed(1)},${H - PAD.b} L${PAD.l},${H - PAD.b} Z`;
    const labelEvery = Math.max(1, Math.ceil(points.length / 6));
    const last = points[points.length - 1];
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(yLabel)}">
    ${ticks.map((t2) => `<g><line x1="${PAD.l}" x2="${W - PAD.r}" y1="${y2(t2).toFixed(1)}" y2="${y2(t2).toFixed(1)}" class="grid"/><text x="${PAD.l - 6}" y="${(y2(t2) + 4).toFixed(1)}" class="tick" text-anchor="end">${esc(t2)}</text></g>`).join("")}
    <path d="${area}" class="area"/>
    ${secondary ? `<path d="${path(secondary)}" class="line-secondary"/>` : ""}
    <path d="${path(points)}" class="line"/>
    ${points.map((p2, i) => i % labelEvery === 0 || i === points.length - 1 ? `<text x="${x(i).toFixed(1)}" y="${H - 10}" class="tick" text-anchor="middle">${esc(p2.label)}</text>` : "").join("")}
    <circle cx="${x(points.length - 1).toFixed(1)}" cy="${y2(last.y).toFixed(1)}" r="4" class="dot"/>
    <text x="${Math.min(x(points.length - 1), W - PAD.r - 40).toFixed(1)}" y="${(y2(last.y) - 10).toFixed(1)}" class="tick strong" text-anchor="middle">${esc(last.y)}${esc(unit)}</text>
  </svg>`;
  }
  function barChart(bars, { unit = "", target = null } = {}) {
    if (!bars.length) return `<div class="chart-empty">Noch keine Daten.</div>`;
    const max = Math.max(1, ...bars.map((b2) => b2.y), target || 0) * 1.15;
    const y2 = scale([0, max], [H - PAD.b, PAD.t]);
    const n = bars.length;
    const bw = (W - PAD.l - PAD.r) / n;
    const ticks = niceTicks(0, max, 4);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    ${ticks.map((t2) => `<g><line x1="${PAD.l}" x2="${W - PAD.r}" y1="${y2(t2).toFixed(1)}" y2="${y2(t2).toFixed(1)}" class="grid"/><text x="${PAD.l - 6}" y="${(y2(t2) + 4).toFixed(1)}" class="tick" text-anchor="end">${esc(t2)}</text></g>`).join("")}
    ${target ? `<line x1="${PAD.l}" x2="${W - PAD.r}" y1="${y2(target).toFixed(1)}" y2="${y2(target).toFixed(1)}" class="target"/>` : ""}
    ${bars.map((b2, i) => {
      const bx = PAD.l + i * bw + bw * 0.15;
      const w = bw * 0.7;
      const top = y2(b2.y);
      return `<g><rect x="${bx.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${(H - PAD.b - top).toFixed(1)}" rx="3" class="bar ${b2.cls || ""}"/>
        ${b2.y ? `<text x="${(bx + w / 2).toFixed(1)}" y="${(top - 5).toFixed(1)}" class="tick" text-anchor="middle">${esc(b2.y)}${esc(unit)}</text>` : ""}
        <text x="${(bx + w / 2).toFixed(1)}" y="${H - 10}" class="tick" text-anchor="middle">${esc(b2.label)}</text></g>`;
    }).join("")}
  </svg>`;
  }
  function volumeBars(rows) {
    const max = Math.max(1, ...rows.map((r) => Math.max(r.value, r.max)));
    return `<div class="vol-list">${rows.map((r) => {
      const pct = (v) => `${Math.min(100, v / max * 100).toFixed(1)}%`;
      const state2 = r.value < r.min ? "low" : r.value > r.max ? "high" : "ok";
      return `<div class="vol-row">
        <div class="vol-label">${esc(r.label)}</div>
        <div class="vol-track"><div class="vol-range" style="left:${pct(r.min)};width:calc(${pct(r.max)} - ${pct(r.min)})"></div><div class="vol-fill ${state2}" style="width:${pct(r.value)}"></div></div>
        <div class="vol-num">${esc(r.value)}<span class="muted">/${esc(r.target)}</span></div>
      </div>`;
    }).join("")}</div>`;
  }

      case "ernaehrung":
        renderErnaehrung(root);
        break;
      case "mehr":
        renderMehr(root);
        break;
      case "uebungen":
        renderUebungen(root, arg);
        break;
      case "kalender":
        renderKalender(root);
        break;
      case "coach":
        renderCoach(root);
        break;
      case "schnell":
        renderSchnell(root);
        break;
      default:
        renderHeute(root);
    }
    nav.querySelectorAll("a").forEach((a2) => a2.classList.toggle("active", a2.getAttribute("href") === `#/${path}` || path === "" && a2.getAttribute("href") === "#/heute"));
    window.scrollTo({ top: 0 });
    if (afterRoute) {
      const fn2 = afterRoute;
      afterRoute = null;
      fn2();
    }
  }
  function renderNav() {
    nav.innerHTML = NAV.map(([href, label, name]) => `<a href="${href}" aria-label="${label}">${icon(name, { size: 24 })}<span>${label}</span></a>`).join("");
  }
  document.addEventListener("change", (e) => {
    const input = e.target;
    if (input.type === "radio" && input.closest(".choices")) {
      input.closest(".choices").querySelectorAll(".choice").forEach((c) => c.classList.toggle("selected", c.querySelector("input").checked));
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
  });
  load();
  subscribe(() => {
    if (!location.hash.startsWith("#/workout")) route();
  });
  renderNav();
  window.addEventListener("hashchange", route);
  route();
  requestPersistentStorage();
  startReminderLoop(state_exports);
  var SINGLE_FILE = true;
  if (!SINGLE_FILE && "serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {
      });
    });
  }
})();

</script>
</body>
</html>
